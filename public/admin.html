<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perplone - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      /* Dark Mode Palette - Consistent with Auth */
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --bg-deep: #020617;
      --glass-panel: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      background-color: var(--bg-deep);
      /* Rich Dark Gradient Background */
      background: radial-gradient(circle at top left, #1e293b, transparent 40%),
        radial-gradient(circle at bottom right, #172554, transparent 40%),
        #020617;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    .topbar {
      height: 72px;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
    }

    .brand i {
      color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #0f172a;
      /* Dark text on bright button */
      border-color: transparent;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    /* Main Container */
    .container {
      flex: 1;
      padding: 2rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Dashboard Stats (Optional Placeholder) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Main Panel */
    .panel {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box {
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search {
      width: 300px;
      max-width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(2, 6, 23, 0.5);
      /* Dark Input */
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
      background: rgba(2, 6, 23, 0.8);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
      /* Prevent squishing */
    }

    thead {
      background: rgba(255, 255, 255, 0.03);
    }

    th {
      text-align: left;
      padding: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem;
      font-size: 0.95rem;
      border-top: 1px solid var(--glass-border);
      color: var(--text-main);
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .status.admin {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.2);
    }

    .status.user {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.2);
    }

    /* --- Chat Sidebar (Right Panel) --- */
    .chat-sidebar {
      position: fixed;
      top: 0;
      right: -500px;
      width: 480px;
      max-width: 90vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--glass-border);
      box-shadow: -10px 0 50px rgba(0, 0, 0, 0.5);
      z-index: 100;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .chat-sidebar.open {
      right: 0;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(2, 6, 23, 0.6);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.25rem;
      padding: 0.5rem;
      border-radius: 8px;
      transition: 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      padding-bottom: 5rem;
      /* Plenty of space at bottom */
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      /* Increased gap */
      min-height: 0;
      /* Critical */
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .sidebar-content::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar-content::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
    }

    .sidebar-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .sidebar-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .chat-session {
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.4);
      overflow: hidden;
      transition: all 0.2s ease;
      flex-shrink: 0;
      /* Prevent shrinking */
    }

    .session-header {
      padding: 1.25rem 1.25rem;
      /* Taller and wider padding */
      background: rgba(255, 255, 255, 0.02);
      font-size: 1.05rem;
      /* Larger font */
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .session-header:hover {
      background: rgba(255, 255, 255, 0.05);
      padding-left: 1.5rem;
      /* Slight slide effect */
    }

    .session-header i {
      transition: transform 0.3s ease;
      color: var(--text-muted);
    }

    .chat-session.active .session-header i {
      transform: rotate(180deg);
      color: var(--primary);
    }

    .session-messages {
      padding: 1rem;
      display: none;
      /* Collapsed by default */
      flex-direction: column;
      gap: 0.75rem;
      max-height: 400px;
      overflow-y: auto;
      border-top: 1px solid var(--glass-border);
      background: rgba(2, 6, 23, 0.3);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .session-messages::-webkit-scrollbar {
      width: 5px;
    }

    .session-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .chat-session.active .session-messages {
      display: flex;
      /* Expanded */
    }

    .msg-row {
      display: flex;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-bubble {
      padding: 0.5rem 0.85rem;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .msg-row.user .msg-bubble {
      background: var(--primary);
      color: #0f172a;
      border-bottom-right-radius: 2px;
    }

    .msg-row.ai .msg-bubble {
      background: rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 2px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .search {
        width: 100%;
      }

      .panel-header {
        flex-direction: column;
        align-items: stretch;
      }

      .title {
        display: none;
      }

      /* Hide text logo on small screens if needed */
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <i class="fas fa-shield-alt"></i> Perplone Admin
    </div>
    <div>
      <button class="btn btn-primary" onclick="logout()">
        <i class="fa fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </div>

  <div class="container">

    <!-- Stats Row (Optional Visual Pop) -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Total Users</span>
        <span class="stat-value" id="totalUsersCount">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Admins</span>
        <span class="stat-value" id="adminCount">-</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">New Today</span>
        <span class="stat-value" id="newUsersCount">0</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <i class="fas fa-users"></i> User Management
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input class="search" id="userSearch" placeholder="Search by name, email, or role..." />
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Role</th>
              <th>Just Joined</th>
              <th>Last Seen</th>
            </tr>
          </thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Chat Monitoring Sidebar -->
  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>
  <div class="chat-sidebar" id="chatSidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <i class="fas fa-history"></i> <span id="sidebarUserName">User History</span>
      </div>
      <button class="close-btn" onclick="closeSidebar()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sidebar-content" id="sidebarContent">
      <!-- Chat history items injected here -->
    </div>
  </div>

  <script>
    "use strict";

    // --- Constants ---
    const BACKEND_URL = "http://localhost:3000";

    // --- DOM Elements ---
    const usersTbody = document.getElementById('usersTbody');
    const userSearch = document.getElementById('userSearch');

    // --- State ---
    let users = [];

    // --- Authentication ---
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.replace('auth.html');
    }

    // --- Data Fetching ---
    // --- Data Fetching ---
    async function loadAdminData() {
      const token = localStorage.getItem('token');

      // 1. Auth Check
      if (!token) {
        window.location.replace('auth.html');
        return;
      }

      // 2. Show Loading State
      usersTbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2rem;">Loading users from database...</td></tr>`;

      try {
        // 3. Verify Token & Role first
        const authRes = await fetch(`${BACKEND_URL}/api/validate-token`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!authRes.ok) {
          logout();
          return;
        }

        const userData = await authRes.json();

        // 4. Enforce Admin Role checking
        if (userData.role !== 'admin') {
          // User is authenticated but not authorized.
          window.location.replace('index.html');
          return;
        }

        // 5. Fetch Admin Data
        const res = await fetch(`${BACKEND_URL}/api/users`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData.error || `Server responded with ${res.status}`);
        }

        // 6. Render Real Data
        users = await res.json();
        updateStats(users); // Calculate stats
        renderUsers();

      } catch (e) {
        console.error("Database connection error:", e);
        usersTbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center; color: var(--danger); padding: 2rem;">
              <i class="fas fa-exclamation-circle"></i> Failed to load data.<br>
              <small style="opacity:0.7">${e.message}</small>
            </td>
          </tr>`;
      }
    }

    function updateStats(data) {
      document.getElementById('totalUsersCount').textContent = data.length;
      document.getElementById('adminCount').textContent = data.filter(u => u.role === 'admin').length;

      // Simple "New Today" check
      const today = new Date().toDateString();
      const newCount = data.filter(u => new Date(u.createdAt).toDateString() === today).length;
      document.getElementById('newUsersCount').textContent = newCount;
    }

    // --- Rendering ---
    function renderUsers() {
      const q = userSearch.value?.toLowerCase() || '';

      // Filter based on search query
      const filteredUsers = users.filter(u =>
        !q ||
        (u.username && u.username.toLowerCase().includes(q)) ||
        (u.email && u.email.toLowerCase().includes(q)) ||
        (u.role && u.role.toLowerCase().includes(q))
      );

      if (filteredUsers.length === 0) {
        usersTbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-muted);">No matching records found</td></tr>`;
        return;
      }

      const rows = filteredUsers.map(u => {
        // Ensure we handle missing fields gracefully
        const safeName = escapeHtml(u.username || 'Unknown');
        const safeEmail = escapeHtml(u.email || 'No Email');
        const safeRole = escapeHtml(u.role || 'user');
        const createdDate = formatDate(u.createdAt);
        const seenDate = formatDate(u.lastSeen);

        // Dynamic icon based on role
        const roleIcon = safeRole === 'admin' ? '<i class="fas fa-shield-alt"></i>' : '<i class="fas fa-user"></i>';

        return `
          <tr onclick="viewUserChats('${u._id}', '${safeName.replace(/'/g, "\\'")}')" style="cursor:pointer" title="Click to view chat history">
            <td>
              <div class="user-cell">
                <div class="user-avatar">
                  ${safeName.charAt(0).toUpperCase()}
                </div>
                <div>
                    <div style="font-weight:600;">${safeName}</div>
                </div>
              </div>
            </td>
            <td style="color:var(--text-muted);">${safeEmail}</td>
            <td>
              <span class="status ${safeRole}">
               ${roleIcon} ${safeRole}
              </span>
            </td>
            <td style="font-size:0.85rem; opacity:0.8;">${createdDate}</td>
            <td style="font-size:0.85rem; opacity:0.8;">${seenDate}</td>
          </tr>`;
      }).join('');

      usersTbody.innerHTML = rows;
    }

    // --- Chat Monitoring ---
    async function viewUserChats(userId, username) {
      document.getElementById('sidebarUserName').textContent = username + "'s Chats";
      const sidebar = document.getElementById('chatSidebar');
      const backdrop = document.getElementById('backdrop');
      const content = document.getElementById('sidebarContent');

      sidebar.classList.add('open');
      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden'; // Prevent background scroll

      content.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading history...</div>';

      try {
        const token = localStorage.getItem('token');
        const res = await fetch(`${BACKEND_URL}/api/admin/user-chats/${userId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error("Failed to fetch chats");

        const chats = await res.json();
        renderSidebarChats(chats);

      } catch (e) {
        console.error(e);
        content.innerHTML = `<div style="color:var(--danger); text-align:center;">Failed to load chats: ${e.message}</div>`;
      }
    }

    function renderSidebarChats(chats) {
      const content = document.getElementById('sidebarContent');
      content.innerHTML = '';

      if (chats.length === 0) {
        content.innerHTML = `
          <div style="text-align:center; padding:3rem; color:var(--text-muted);">
            <i class="fas fa-comment-slash" style="font-size:2rem; margin-bottom:1rem; display:block;"></i>
            No chat history found for this user.
          </div>`;
        return;
      }

      chats.forEach(chat => {
        const dateStr = new Date(chat.createdAt).toLocaleString(undefined, {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const sessionDiv = document.createElement('div');
        sessionDiv.className = 'chat-session';
        // Add click handler to toggle
        sessionDiv.innerHTML = `
          <div class="session-header" onclick="toggleSession(this)">
            <div style="display:flex; align-items:center; gap:0.5rem; overflow:hidden;">
              <div style="width:6px; height:6px; background:${chat.pinned ? '#fbbf24' : 'var(--primary)'}; border-radius:50%;"></div>
              <strong style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(chat.title)}</strong>
            </div>
            <div style="display:flex; align-items:center; gap:0.75rem;">
              <span style="font-size:0.75rem; color:var(--text-muted);">${dateStr}</span>
              <i class="fas fa-chevron-down" style="font-size:0.8rem;"></i>
            </div>
          </div>
          <div class="session-messages">
            ${chat.messages.length > 0 ? chat.messages.map(m => `
              <div class="msg-row ${m.type === 'user-msg' ? 'user' : 'ai'}">
                <div class="msg-bubble">${escapeHtml(m.text)}</div>
              </div>
            `).join('') : '<div style="text-align:center; opacity:0.5; font-size:0.85rem;">No messages in this chat</div>'}
          </div>
        `;
        content.appendChild(sessionDiv);
      });
    }

    function toggleSession(header) {
      const session = header.parentElement;
      // Close others (optional, acts like proper accordion)
      // const all = document.querySelectorAll('.chat-session');
      // all.forEach(el => {
      //   if (el !== session) el.classList.remove('active');
      // });

      session.classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('chatSidebar').classList.remove('open');
      document.getElementById('backdrop').classList.remove('open');
      document.body.style.overflow = '';
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatDate(v) {
      if (!v) return '<span style="opacity:0.3">-</span>';
      const d = new Date(v);
      if (isNaN(d.getTime())) return '<span style="opacity:0.3">-</span>';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
        ' <span style="opacity:0.5; font-size:0.8em">' +
        d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
        '</span>';
    }

    // --- Event Listeners ---
    userSearch.addEventListener('input', renderUsers);

    // Initial Load
    loadAdminData();
  </script>
</body>

</html>
